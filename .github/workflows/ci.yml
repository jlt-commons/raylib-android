# The pure half, on every push. The Android half is not here on purpose.
#
# Building the app needs an Android SDK and NDK, a fifteen-minute Chez
# cross-build for tarm64le, and Gradle. That is a lot of machinery to prove
# something a runner cannot check anyway, since nothing in CI can put a frame
# on a phone. The scenes are pure .cljc precisely so their behaviour is
# testable without any of it, and the rest is proven by running on hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt to test under (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

# jolt is the runtime this project actually ships on (the Android build is a
# `jolt build-app` cross-compile), and jlt-commons/ci-builds dispatches this
# workflow with a jolt-version input to test the whole fleet against a
# candidate release before it lands anywhere. Matches deps.edn's own
# :jolt/min-version floor.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.6' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      # The project declares no dependencies, so there is nothing to restore
      # beyond the CLI's own. Kept anyway because the :cider alias has some.
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}

      - name: Test
        run: clojure -M:test

  jolt:
    name: tests on jolt ${{ inputs.jolt-version || '0.8.6' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          jolt --version

      # deps.edn's own `test` task ("jolt -M:test") is exactly this: the pure
      # namespaces, on the host, no raylib and no device. This is the run
      # that matters -- the JVM job above catches ordinary Clojure mistakes,
      # not a jolt-specific divergence, which is the whole reason ci-builds
      # fans a candidate jolt across every project here.
      - name: Test under jolt
        run: jolt -M:test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clj-kondo
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          clj-kondo: latest

      # Clean as of the open-sourcing pass, so a new warning is a real one.
      - name: Lint
        run: clj-kondo --lint src test --fail-level warning

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, because the distro version and a developer's brew version
      # disagree about which bashisms to flag. An unpinned checker that is
      # green locally and red here costs a round trip to find out why, and
      # the first time it happened the finding was real: `-nt` in deploy.sh,
      # which 0.9.0 flags and 0.11.0 does not.
      - name: Shellcheck tools/android
        env:
          SHELLCHECK_VERSION: v0.9.0
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
          # -S warning: the scripts are POSIX sh and use some deliberate word
          # splitting, which style-level checks object to.
          # common.sh is sourced rather than run, so it is linted as a shell
          # library and every script that sources it is told where it lives.
          shellcheck -S warning -x tools/android/*.sh
