org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

# There is no Java, Kotlin, AndroidX or R class in this app: it is one
# NativeActivity, one .so compiled from main.c and raylib, and the Jolt library
# staged beside it. Nothing here switches the rest of Gradle's machinery off,
# deliberately: the android.defaults.buildfeatures.* flags that would are the
# ones whose names change between AGP majors, and an unrecognised android.*
# property is a build failure rather than a warning. AndroidManifest.xml's
# android:hasCode="false" is what actually says there is no code to build.

# The API level the NDK compiles against and the APK's minSdk, in one place.
# tools/android/pack.sh cross-builds Chez against the SAME level -- they must
# match, or the app links against a Bionic the device does not have.
#
# 26 (Android 8.0) is the floor here, chosen because Chez 10.4.1's kernel needs
# nothing newer once iconv is disabled and raylib's Android backend needs
# nothing newer at all. The upstream Android experiment this port follows
# proved the stack at 35; if a Chez cross-build ever fails on a Bionic symbol,
# raise this and pass the same value to pack.sh.
raylib.apiLevel=26
